# dsh-dev-plan-presets — bundle 根补丁
#
# 0.3.0 起本包是 Host 插件：dev-plan preset 由 index.js 在运行时通过
# ctx.agentPresets.register() 动态注册，以便按设置切换施工子代理 preset。
# 这里**只挂根插件一行**，不再静态声明 @deepseek-ai/dsh-agent-preset；
# 否则会与动态注册重名，导致 preset 注册失败。
#
# 想改配置优先用插件页的本插件设置（写入 configEditor），不要手改 profile 的
# cordis.patch.yml；手工写 config 也合法，但会被完整校验。
- insert:
    - id: dev-plan-presets
      name: dsh-dev-plan-presets
      config:
        developMode: standard
        childProvider: dsh-opencode-go
        childModel: deepseek-v4.1-flash
        childReasoningEffort: ''
        modelGuardMode: pin
        killOnViolation: true
        honorExplicit: false
        audit: true
        guardAllSubagents: false
        mainToolMode: ask-edit
        mainStepWarnThreshold: 6
