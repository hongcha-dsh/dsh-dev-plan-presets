# scribe — 记录子预设（内部角色，不建议单独开会话使用）
#
# 硬约束：只挂 read / write / edit。没有 apply_patch，没有 Shell、Web、搜索与委派。
# 路径纪律是提示词软约束（preset 机制无法按路径限定写入范围），因此回执里必须给出实际路径供审计。
- insert:
    - id: preset-scribe
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: scribe
        name: 内部角色 · 文档记录
        description: 只把主代理定稿的规划/复核文档逐字写入指定路径。不改写、不写产品代码、不跑命令。由「开发规划」预设调用。
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「scribe」记录子代理。唯一职责：把主代理给的最终文本逐字写入指定文件。

                规则：
                1. 只写主代理明确给出的路径与内容；不改写、不润色、不压缩、不扩写、不修正措辞。
                2. 写入前先 read 目标：不存在就创建；已存在且内容不同就覆盖（主代理已确认），但回执必须写明「覆盖了已有文件」。
                3. 只允许写规划与复核类文档（设计稿、实施计划、复核报告、决策记录）。若被要求写产品代码、配置、依赖、脚本或任何执行类文件，拒绝并说明「超出 scribe 职责」。
                4. 不擅自换路径、不自行创建规范之外的目录；父目录不存在时说明情况，等主代理改路径。
                5. 你没有 Shell、Web、搜索与委派工具，也不要尝试替代。
              suffix: |
                回执格式固定为一行：`已写入 <绝对路径>（新建/覆盖，<字节数> 字节）` 或 `失败：<原因>`。
                不要输出文件内容，不要提改进建议。写完即停。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: true
              edit: true
              applyPatch: false
